---
layout: default
---

<div class="brand">
  <h1>{{ site.title | escape }}</h1>
</div>

{{ content }}

<ul class="social-media">
  <li>
    <a href="https://github.com/{{ site.github.username | cgi_escape | escape }}" rel="me" aria-label="{{ site.github.title | escape }}">
      {% include social-icon.html type="github" %}
    </a>
  </li>

  <li>
    <a href="https://www.linkedin.com/in/{{ site.linkedin.profile | cgi_escape | escape }}" rel="me" aria-label="{{ site.linkedin.title | escape }}">
      {% include social-icon.html type="linkedin" %}
    </a>
  </li>

  <li>
    <a href="https://www.xing.com/profile/{{ site.xing.username | cgi_escape | escape }}" rel="me" aria-label="{{ site.xing.title | escape }}">
      {% include social-icon.html type="xing" %}
    </a>
  </li>

  <li>
    <a href="https://stackoverflow.com/u/{{ site.stackoverflow.id }}" rel="me" aria-label="{{ site.stackoverflow.title | escape }}">
      {% include social-icon.html type="stackoverflow" %}
    </a>
  </li>
</ul>
