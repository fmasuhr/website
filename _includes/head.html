<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- comment -%} Capture to coerce a numeric title to a string, which `escape` requires {%- endcomment -%}
  {%- capture title -%}{{ page.title }}{%- endcapture %}
  <title>{{ site.title | escape }}{% if page.title %} | {{ title | escape }}{% endif %}</title>

  {% seo title=false %}
  {%- if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {%- endif %}

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#222326">

  <link rel="icon" href="{{ "/assets/favicon.ico" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
